name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests never call Groq. Leave the key unset on purpose.
      GROQ_API_KEY: ""
      DEMO_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests evals
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Evals (offline, stubbed LLM)
        run: python -m evals.run
      - name: Upload eval summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-summary
          path: evals/results/
          if-no-files-found: ignore
